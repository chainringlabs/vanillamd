name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@8257523ec32ecf78bb71af30090b87d5220ebe84 # v1.4.1
    with:
      node-version: "26"
    secrets: inherit

  image:
    needs: supply-chain
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@8257523ec32ecf78bb71af30090b87d5220ebe84 # v1.4.1
